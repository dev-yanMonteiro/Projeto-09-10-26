
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página Inicial</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="#">MeuProjeto</a>

            <div>
                <a class="btn btn-outline-light me-2" href="#cadastro">
                    Cadastro
                </a>

                <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#modalLogin">
                    Login
                </button>
            </div>

        </div>
    </nav>

    <!-- PÁGINA INICIAL -->
    <section class="inicio text-center">
        <div class="container">

            <h1>Bem-vindo ao Projeto!</h1>

            <p>Crie sua conta e comece agora.</p>

            <a href="#cadastro" class="btn btn-primary">
                Criar minha conta
            </a>

            <button class="btn btn-outline-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalLogin">
                Entrar
            </button>

        </div>
    </section>

    <!-- CADASTRO -->
    <section id="cadastro" class="container cadastro">

        <h2 class="text-center">Criar cadastro</h2>

        <form id="formCadastro">

            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" class="form-control"
                placeholder="Digite seu nome" required>

            <label for="email" class="form-label mt-3">E-mail:</label>
            <input type="email" id="email" class="form-control"
                placeholder="Digite seu e-mail" required>

            <label for="senha" class="form-label mt-3">Senha:</label>
            <input type="password" id="senha" class="form-control"
                placeholder="Crie uma senha" minlength="8" required>

            <small class="text-muted">
                Use 8 caracteres, letra maiúscula, minúscula,
                número e símbolo.
            </small>

            <button type="submit" class="btn btn-primary mt-4 w-100">
                Cadastrar
            </button>

        </form>

        <p id="mensagem" class="text-center mt-3"></p>

    </section>

    <!-- MODAL DE LOGIN -->
    <div class="modal fade" id="modalLogin" tabindex="-1">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Fazer login</h5>

                    <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <form id="formLogin">

                        <label for="emailLogin" class="form-label">
                            E-mail:
                        </label>

                        <input type="email" id="emailLogin"
                            class="form-control" required>

                        <label for="senhaLogin" class="form-label mt-3">
                            Senha:
                        </label>

                        <input type="password" id="senhaLogin"
                            class="form-control" required>

                        <button type="submit"
                            class="btn btn-primary mt-4 w-100">
                            Entrar
                        </button>

                    </form>

                    <p id="mensagemLogin" class="text-center mt-3"></p>

                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript do Bootstrap: necessário para o modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nosso JavaScript -->
    <script src="script.js"></script>

</body>
</html>
